[package]
name = "draupnir"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "draupnir"
path = "src/main.rs"

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
nix = { version = "0.31.3", features = ["mount", "poll", "fs", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
tar = "0.4.46"
toml = "1.1.4"
udev = "0.9.3"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3"
